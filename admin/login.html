<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | No. Chelmsford Lanes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/login.css">
</head>
<body>

<div class="login-card">
    <div class="card-header">
        <div class="brand">No. Chelmsford Lanes</div>
        <div class="brand-sub">Staff Administration</div>
    </div>

    <div class="card-body">
        <h1>Staff Login</h1>
        <p class="subtitle">Enter your password to access the reservation manager.</p>

        <div class="error-banner" id="error-banner"></div>

        <form method="POST" action="/admin/login" autocomplete="off">
            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"
                    autocomplete="current-password"
                    autofocus
                    required
                >
            </div>
            <button type="submit" class="btn-enter">Enter</button>
        </form>
    </div>

    <div class="card-footer">
        No. Chelmsford Lanes &mdash; Staff Only
    </div>
</div>

<script src="/admin/login.js"></script>

</body>
</html>
