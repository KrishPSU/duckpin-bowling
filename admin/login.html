<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | No. Chelmsford Lanes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #3E2723;
            --accent-red: #B73225;
            --bg-cream: #F4EFE6;
            --section-bg: #E6DCC8;
            --text-dark: #2C1E16;
            --border-color: #D4C5B0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Libre Baskerville', serif;
            background-color: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(0,0,0,0.04) 40px,
                rgba(0,0,0,0.04) 80px
            );
        }

        .login-card {
            background: var(--bg-cream);
            border-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary-dark);
            border-bottom: 4px solid var(--accent-red);
            padding: 2rem 2.5rem;
            text-align: center;
        }

        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            color: var(--bg-cream);
            letter-spacing: 2px;
            line-height: 1;
        }

        .brand-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            color: rgba(244, 239, 230, 0.55);
            letter-spacing: 3px;
            margin-top: 4px;
        }

        .card-body {
            padding: 2.5rem 2.5rem 2rem;
        }

        .card-body h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            color: var(--primary-dark);
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
        }

        .card-body .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        /* Error banner */
        .error-banner {
            display: none;
            background: #FDECEA;
            border: 1px solid #F5C6C2;
            border-left: 4px solid var(--accent-red);
            border-radius: 4px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #7B1D16;
            font-weight: bold;
        }

        .error-banner.visible { display: block; }

        /* Form */
        .field { margin-bottom: 1.5rem; }

        .field label {
            display: block;
            font-weight: bold;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .field input[type="password"] {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            background-color: white;
            border-radius: 4px;
            font-family: 'Libre Baskerville', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            letter-spacing: 5px;
            transition: border-color 0.2s;
        }

        .field input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-dark);
        }

        .field input[type="password"].shake {
            animation: shake 0.4s ease;
            border-color: var(--accent-red);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        .btn-enter {
            width: 100%;
            padding: 18px;
            background-color: var(--primary-dark);
            color: var(--bg-cream);
            border: none;
            border-radius: 4px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.25);
            transition: background-color 0.2s, transform 0.15s;
        }

        .btn-enter:hover { background-color: var(--accent-red); transform: translateY(-2px); }

        .card-footer {
            background-color: var(--section-bg);
            border-top: 1px solid var(--border-color);
            padding: 1rem 2.5rem;
            text-align: center;
            font-size: 0.88rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card-header">
        <div class="brand">No. Chelmsford Lanes</div>
        <div class="brand-sub">Staff Administration</div>
    </div>

    <div class="card-body">
        <h1>Staff Login</h1>
        <p class="subtitle">Enter your password to access the reservation manager.</p>

        <div class="error-banner" id="error-banner"></div>

        <form method="POST" action="/admin/login" autocomplete="off">
            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"
                    autocomplete="current-password"
                    autofocus
                    required
                >
            </div>
            <button type="submit" class="btn-enter">Enter</button>
        </form>
    </div>

    <div class="card-footer">
        No. Chelmsford Lanes &mdash; Staff Only
    </div>
</div>

<script>
    // Read ?error= from the URL and show the appropriate message
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const banner = document.getElementById('error-banner');
    const input  = document.getElementById('password');

    if (error === 'wrong') {
        banner.textContent = 'Incorrect password. Please try again.';
        banner.classList.add('visible');
        input.classList.add('shake');
        input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
    } else if (error === 'rate') {
        banner.textContent = 'Too many failed attempts. Please wait one minute and try again.';
        banner.classList.add('visible');
    }

    // Clear the ?error= from the URL bar so refreshing doesn't re-show old errors
    if (error) {
        history.replaceState(null, '', '/admin/login');
    }
</script>

</body>
</html>
